[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nocap"
version = "0.2.0"
description = "No evidence, no answer. The hallucination firewall for RAG and AI agents: an evidence gate with MCP server, Python SDK, OpenAI-compatible/Ollama judges and CI route tests."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "Apache-2.0"
authors = [{name = "xi029"}]
keywords = ["rag", "hallucination", "llm", "guardrails", "mcp", "mcp-server", "ai-agents", "ollama", "openai", "deepseek", "langchain", "llamaindex", "evaluation", "local-first"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
laya = ["laya[serve]>=0.3.7,<1"]
mcp = [
    "mcp>=2,<3",
]

[project.scripts]
nocap = "nocap.cli:main"

[project.urls]
Homepage = "https://github.com/xi029/nocap"
Documentation = "https://github.com/xi029/nocap#readme"
Repository = "https://github.com/xi029/nocap"
Issues = "https://github.com/xi029/nocap/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nocap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
cache_dir = ".cache/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
