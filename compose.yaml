services:
  nocap:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      NOCAP_PROVIDER: ${NOCAP_PROVIDER:-demo}
      NOCAP_OLLAMA_URL: http://host.docker.internal:11434
      NOCAP_OLLAMA_MODEL: ${NOCAP_OLLAMA_MODEL:-qwen3.5:4b}
      NOCAP_OPENAI_URL: ${NOCAP_OPENAI_URL:-https://api.openai.com/v1}
      NOCAP_OPENAI_MODEL: ${NOCAP_OPENAI_MODEL:-}
      NOCAP_OPENAI_API_KEY: ${NOCAP_OPENAI_API_KEY:-}
      NOCAP_LAYA_URL: http://host.docker.internal:8123
      NOCAP_LAYA_MODEL: ${NOCAP_LAYA_MODEL:-english}
      NOCAP_LAYA_API_KEY: ${NOCAP_LAYA_API_KEY:-}
      NOCAP_JEV_API_KEY: ${NOCAP_JEV_API_KEY:-}
    volumes:
      - nocap-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  nocap-data:
